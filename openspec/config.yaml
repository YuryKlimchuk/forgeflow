context: |
  # ForgeFlow

  SaaS-платформа для управления электронными спецификациями изделий (BOM) и
  расчёта потребностей производства, ориентированная на малые производственные
  предприятия (простая альтернатива сложным ERP/MRP-системам).

  ## Домен
  - Каталог изделий, деталей, материалов и покупных компонентов.
  - Многоуровневые спецификации (BOM) с версионированием и альтернативными
    материалами/комплектующими (приоритеты, условия применения, коэффициенты пересчёта).
  - Технологические процессы (последовательность операций).
  - Расчёт производственных потребностей: по выбранному изделию и количеству
    определить, что изготовить и что закупить, с учётом вложенности спецификаций
    и альтернатив. Результат расчёта должен быть прозрачным и объяснимым.
  - Документы и экспорт (печать спецификаций, PDF, экспорт потребностей).

  ## Технологии
  - Java 25, сборка Maven.
  - Spring Boot 4.1+ (точную стабильную версию уточнить перед реализацией).
  - Spring Modulith — модульный монолит.
  - DDD и Hexagonal Architecture (порты и адаптеры).
  - PostgreSQL, миграции Flyway.
  - Keycloak — аутентификация; бизнес-права и доступ к организациям проверяет ForgeFlow.
  - Тесты: JUnit 5, интеграционные и архитектурные тесты.

  ## Архитектурные ограничения
  - Бизнес-логика — в доменном слое; домен не зависит от Spring, PostgreSQL и внешних интеграций.
  - Модули имеют чёткие границы и направленные зависимости без циклов.
  - Схема БД меняется только версионируемыми миграциями Flyway.
  - Переход к микросервисам не является целью; допустим только при обоснованной необходимости.

  ## SaaS и безопасность
  - Multi-tenant: разные организации на одной платформе, изоляция данных на уровне
    приложения и схемы данных; изоляция проверяется автоматизированными тестами.
  - Пользователь может иметь доступ к одной или нескольким организациям.

  ## Правила разработки
  - Новые функциональные изменения анализируются и описываются через OpenSpec.
  - Новая функциональность сопровождается автоматизированными тестами.
  - Не придумывать неподтверждённые бизнес-правила: неопределённости фиксировать
    и согласовывать до реализации.
  - Сохранять совместимость существующих контрактов, если их изменение не входит в задачу.
  - Избегать необоснованных зависимостей, усложнения инфраструктуры и преждевременной оптимизации.

  ## Границы MVP
  Входят: каталог изделий/деталей/материалов/комплектующих; BOM с альтернативами;
  расчёт потребностей по производственному плану; разделение на изготовление/закупку;
  сохранение результатов и использованных версий спецификаций; экспорт и документы.
  Не входят: складской учёт, закупки, календарное планирование, оптимизация загрузки
  оборудования, расширенное управление технологическими операциями.

  ## Язык и нумерация
  - Артефакты OpenSpec и требования писать на русском языке.
  - Каждый proposal нумеруется по порядку: 0, 1, 2, ... (префикс имени change в kebab-case).

