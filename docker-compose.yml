services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: forgeflow
      POSTGRES_USER: forgeflow
      POSTGRES_PASSWORD: forgeflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/forgeflow-users-realm.json:/opt/keycloak/data/import/forgeflow-users-realm.json:ro
      - ./keycloak/forgeflow-admins-realm.json:/opt/keycloak/data/import/forgeflow-admins-realm.json:ro

volumes:
  pgdata:
