spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/forgeflow
    username: forgeflow
    password: forgeflow
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

forgeflow:
  security:
    issuers:
      - issuer: http://localhost:8081/realms/forgeflow-users
        realm: forgeflow-users
      - issuer: http://localhost:8081/realms/forgeflow-admins
        realm: forgeflow-admins
